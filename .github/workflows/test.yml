name: Verify StudyTrail
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=optional
      - run: npm test
      - run: npm run privacy:check
  installers:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check macOS installer with offline fixtures
        if: runner.os == 'macOS'
        run: bash -n scripts/install.sh && node tests/installers.cjs
      - name: Check Windows installer with offline fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installers-windows.ps1
